site_name: RIME
site_description: Multimodal Annotator for Movement Disorder Research
site_url: https://neurocog-mobility.github.io/rime
repo_url: https://github.com/neurocog-mobility/rime
repo_name: neurocog-mobility/rime
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/rime-logo-dark.png
  favicon: assets/rime-icon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  homepage_animation_credit: 'Homepage animation derived from <a href="https://openprocessing.org/sketch/1406642">Snowflake Generator</a> by Ivan Rudnicki, <a href="https://creativecommons.org/licenses/by-nc-sa/3.0">CC BY-NC-SA 3.0</a>.'

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Guide:
    - Install: getting-started/installation.md
    - Create a workspace: getting-started/first-session.md
    - Annotate: annotation/workflow.md
    - Review: quality-assurance/review-layers.md
    - Run a model: models/loading-a-model.md
    - Save and compare measurements: clinical-analysis/clinical-metrics.md
    - Save and reopen work: study-setup/workspace-persistence.md
    - Examples: examples.md
  - Reference:
    - Study protocols: study-setup/protocol-schema.md
    - RIME specification: measurement-records/rime-specification.md
    - Exchange API: measurement-records/exchange.md
    - Comparison semantics: measurement-records/comparison.md
    - CMF specification: models/cmf-specification.md
    - CMF examples: models/cmf-example.md
