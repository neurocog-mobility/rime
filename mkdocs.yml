site_name: RIME
site_description: Multimodal Annotator for Movement Disorder Research
site_url: https://neurocog-mobility.github.io/rime
repo_url: https://github.com/neurocog-mobility/rime
repo_name: neurocog-mobility/rime
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/rime-logo-dark.png
  favicon: assets/rime-icon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  homepage_animation_credit: 'Homepage animation derived from <a href="https://openprocessing.org/sketch/1406642">Snowflake Generator</a> by Ivan Rudnicki, <a href="https://creativecommons.org/licenses/by-nc-sa/3.0">CC BY-NC-SA 3.0</a>.'

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - RIME: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Your First Session: getting-started/first-session.md
    - Importing from ELAN: getting-started/import-from-elan.md
  - Study Setup:
    - Protocol & Schema: study-setup/protocol-schema.md
    - Session Wizard: study-setup/session-wizard.md
    - Signal Configuration: study-setup/signal-config.md
  - Annotation:
    - Annotation Workflow: annotation/workflow.md
    - Labels & Lanes: annotation/labels-and-lanes.md
    - Rules & Violations: annotation/rules-and-violations.md
    - Checkpoints: annotation/checkpoints.md
  - Quality Assurance:
    - Review Layers: quality-assurance/review-layers.md
    - Inter-Rater Reliability: quality-assurance/irr.md
  - Clinical Analysis:
    - Coverage: clinical-analysis/coverage.md
    - Clinical Metrics: clinical-analysis/clinical-metrics.md
  - Export:
    - Session Reports: export/session-reports.md
    - Annotation Export: export/annotation-export.md
    - Dataset Export: export/dataset-export.md
  - Models:
    - What is CMF?: models/what-is-cmf.md
    - CMF in Practice: models/cmf-example.md
    - Loading a Model: models/loading-a-model.md
    - Model Evaluation: models/model-evaluation.md
