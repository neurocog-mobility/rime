[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocog-rime-core"
version = "0.2.0"
description = "Headless core logic for the RIME multimodal annotation platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Lab Neurocog" }
]
dependencies = [
    "jsonschema>=4.18",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "tomli>=2; python_version < '3.11'",
    "scipy>=1.10",
    "pympi-ling>=1.71",
    "onnxruntime>=1.16",
    "opencv-contrib-python>=4.8",
]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/rime_core"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
