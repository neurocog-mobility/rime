[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocog-rime-ui"
version = "0.1.0"
description = "Desktop Qt UI for the RIME multimodal annotation platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Lab Neurocog" }
]
dependencies = [
    "neurocog-rime-core>=0.1.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "qtawesome>=1.3",
    "duckdb>=0.9",
]

[project.optional-dependencies]
video = [
    "opencv-contrib-python>=4.8",
]

[project.scripts]
rime = "rime_ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rime_ui"]
